name: Deploy GitHub Pages

# Publishes the repository as the OhMyOrch documentation site.
# Site URL: https://josoroma.github.io/OhMyOrch
#
# The harness is documentation- and configuration-first: there is no build step.
# The static `.html` under docs/pages/ is generated by /generate-html-page and is
# committed to the repository, so the workflow only uploads the tree as-is.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
