    <rect width="1600" height="900" fill="url(#glowB)"/>
    <rect x="1380" y="148" width="148" height="84" fill="url(#dots)"/>

    <!-- kicker -->
    <rect x="72" y="64" width="214" height="46" rx="23" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
    <use href="#i-box" x="92" y="76" width="22" height="22" color="#2b7fff"/>
    <text x="128" y="94" font-size="15" font-weight="600" letter-spacing="3" fill="#a1a1a1">DISTRIBUTION</text>
    <text x="1528" y="96" font-size="18" font-weight="500" letter-spacing="2" text-anchor="end" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">06</text>

    <!-- headline -->
    <text x="72" y="206" font-size="72" font-weight="800" letter-spacing="-2" fill="#fafafa">Validate first. <tspan fill="url(#hl2)">Publish second.</tspan></text>
    <text x="72" y="254" font-size="25" fill="#a1a1a1"><tspan fill="#fafafa">0.1.0</tspan> is the source version; the last tagged release is <tspan fill="#fafafa">0.0.1</tspan>.</text>

    <!-- prerequisites -->
    <g>
      <rect x="72" y="290" width="718" height="500" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="96" y="312" width="48" height="48" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
      <use href="#i-list" x="108" y="324" width="24" height="24" color="#2b7fff"/>
      <text x="160" y="344" font-size="22" font-weight="700" fill="#fafafa">Prerequisites</text>

      <rect x="96" y="380" width="670" height="52" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <use href="#i-file" x="114" y="396" width="20" height="20" color="#2b7fff"/>
      <text x="150" y="412" font-size="18" fill="#a1a1a1"><tspan font-weight="600" fill="#fafafa">OpenSpec</tspan><tspan dx="12" font-size="16">validation target, separate install</tspan></text>
      <rect x="650" y="391" width="104" height="30" rx="15" fill="#262626"/>
      <text x="702" y="412" font-size="16" text-anchor="middle" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1.13.2</text>

      <rect x="96" y="440" width="670" height="52" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <use href="#i-terminal" x="114" y="456" width="20" height="20" color="#2b7fff"/>
      <text x="150" y="472" font-size="18" font-weight="600" fill="#fafafa">Bash</text>
      <rect x="650" y="451" width="104" height="30" rx="15" fill="#262626"/>
      <text x="702" y="472" font-size="16" text-anchor="middle" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3.2+</text>

      <rect x="96" y="500" width="670" height="52" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <use href="#i-braces" x="114" y="516" width="20" height="20" color="#2b7fff"/>
      <text x="150" y="532" font-size="18" font-weight="600" fill="#fafafa">jq</text>
      <rect x="650" y="511" width="104" height="30" rx="15" fill="#262626"/>
      <text x="702" y="532" font-size="16" text-anchor="middle" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1.6+</text>

      <rect x="96" y="560" width="670" height="52" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <use href="#i-wrench" x="114" y="576" width="20" height="20" color="#2b7fff"/>
      <text x="150" y="592" font-size="18" font-weight="600" fill="#fafafa">Git, shasum, Unix utilities</text>
      <rect x="650" y="571" width="104" height="30" rx="15" fill="#262626"/>
      <text x="702" y="592" font-size="16" text-anchor="middle" fill="#a1a1a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">required</text>

      <rect x="96" y="636" width="670" height="130" rx="10" fill="#00bc7d" fill-opacity="0.08" stroke="#5ee9b5" stroke-opacity="0.30"/>
      <rect x="116" y="677" width="48" height="48" rx="12" fill="#5ee9b5" fill-opacity="0.12"/>
      <use href="#i-check" x="128" y="689" width="24" height="24" color="#5ee9b5"/>
      <text x="184" y="682" font-size="22" font-weight="700" fill="#fafafa">Claude Code <tspan fill="#5ee9b5">2.1.314</tspan></text>
      <text x="184" y="710" font-size="18" fill="#a1a1a1">Format and cache checks for 0.1.0 ran on it</text>
      <text x="184" y="736" font-size="18" fill="#a1a1a1">Versions before 2.1.139 lack exec-form hooks</text>
    </g>

    <!-- install -->
    <g>
      <rect x="810" y="290" width="718" height="256" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="834" y="312" width="48" height="48" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
      <use href="#i-download" x="846" y="324" width="24" height="24" color="#2b7fff"/>
      <text x="898" y="344" font-size="22" font-weight="700" fill="#fafafa">Install from the marketplace</text>

      <rect x="834" y="380" width="670" height="114" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="858" cy="396" r="5" fill="#ffffff" fill-opacity="0.18"/>
      <circle cx="876" cy="396" r="5" fill="#ffffff" fill-opacity="0.18"/>
      <circle cx="894" cy="396" r="5" fill="#ffffff" fill-opacity="0.18"/>
      <text x="1484" y="401" font-size="15" text-anchor="end" fill="#737373">Claude Code</text>
      <rect x="834" y="412" width="670" height="1" fill="#ffffff" fill-opacity="0.10"/>
      <text x="858" y="445" font-size="18" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#2b7fff">/plugin</tspan> marketplace add josoroma/OhMyOrch</text>
      <text x="858" y="475" font-size="18" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#2b7fff">/plugin</tspan> install ohmyorch@ohmyorch-marketplace</text>

      <text x="834" y="526" font-size="18" fill="#a1a1a1">Then choose user, project or local scope.</text>
    </g>

    <!-- release gates -->
    <g>
      <rect x="810" y="566" width="718" height="224" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="834" y="588" width="48" height="48" rx="12" fill="#ff6467" fill-opacity="0.13"/>
      <use href="#i-lock" x="846" y="600" width="24" height="24" color="#ff6467"/>
      <text x="898" y="620" font-size="22" font-weight="700" fill="#fafafa">Release gates still open</text>
      <rect x="1368" y="596" width="136" height="32" rx="16" fill="#262626"/>
      <text x="1436" y="617" font-size="15" font-weight="600" letter-spacing="2" text-anchor="middle" fill="#a1a1a1">4 PENDING</text>

      <g fill="none" stroke="#737373" stroke-width="2">
        <circle cx="858" cy="666" r="6"/>
        <circle cx="858" cy="696" r="6"/>
        <circle cx="858" cy="726" r="6"/>
        <circle cx="858" cy="756" r="6"/>
      </g>
      <text x="898" y="672" font-size="18" fill="#fafafa">Authenticated agent identity and denial tests</text>
      <text x="898" y="702" font-size="18" fill="#fafafa">Authenticated full story lifecycle test</text>
      <text x="898" y="732" font-size="18" fill="#fafafa">Validation on the latest stable Claude Code</text>
      <text x="898" y="762" font-size="18" fill="#fafafa">Distribution license chosen by the owner</text>
    </g>

    <!-- footer -->
    <rect x="72" y="822" width="1456" height="1" fill="#ffffff" fill-opacity="0.10"/>
    <text x="72" y="864" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#fafafa">Oh<tspan fill="url(#hl)">My</tspan>Orch</text>
    <text x="800" y="862" font-size="15" letter-spacing="3" text-anchor="middle" fill="#737373">CLAUDE CODE + OPENSPEC</text>
