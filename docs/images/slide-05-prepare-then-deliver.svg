<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Prepare, then deliver: READY is the contract between intent and execution</title>
  <desc id="d">Four steps in order: analyze the codebase, generate or ingest the intent, deliver one READY story, and resume the recorded goal. An epic target delivers every story of the epic in SPECS.md order, one active change at a time, owned by one session.</desc>
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b7fff"/>
      <stop offset="1" stop-color="#5ee9b5"/>
    </linearGradient>
    <linearGradient id="hlr" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="296" y2="0">
      <stop offset="0" stop-color="#2b7fff"/>
      <stop offset="1" stop-color="#5ee9b5"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#2b7fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2b7fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#00bc7d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00bc7d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="900" rx="28"/></clipPath>
    <symbol id="i-file" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h8"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></g></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></g></symbol>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="#0a0a0a"/>
    <rect width="1600" height="900" fill="url(#glowA)"/>
    <rect width="1600" height="900" fill="url(#glowB)"/>
    <rect x="1340" y="170" width="200" height="110" fill="url(#dots)"/>

    <!-- kicker -->
    <rect x="72" y="64" width="334" height="46" rx="23" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
    <use href="#i-list" x="92" y="76" width="22" height="22" color="#2b7fff"/>
    <text x="128" y="94" font-size="15" font-weight="600" letter-spacing="3" fill="#a1a1a1">PREPARE, THEN DELIVER</text>
    <text x="1528" y="96" font-size="18" font-weight="500" letter-spacing="2" text-anchor="end" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">05</text>

    <!-- headline -->
    <text x="72" y="206" font-size="68" font-weight="800" letter-spacing="-2" fill="#fafafa"><tspan fill="url(#hlr)">READY</tspan> is the contract</text>
    <text x="72" y="280" font-size="68" font-weight="800" letter-spacing="-2" fill="#fafafa">between intent and execution.</text>
    <text x="72" y="330" font-size="25" fill="#a1a1a1">Analyze the code, write or ingest the intent, deliver, then resume.</text>

    <!-- step rail: numbers joined by arrows -->
    <g>
      <g stroke="#2b7fff" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" fill="none">
        <path d="M94 441V462"/>
        <path d="M94 539V570"/>
        <path d="M94 593V604"/>
        <path d="M94 681V702"/>
      </g>
      <g fill="#5ee9b5">
        <path d="M-9 -8 9 0 -9 8Z" transform="translate(94 473) rotate(90)"/>
        <path d="M-9 -8 9 0 -9 8Z" transform="translate(94 615) rotate(90)"/>
        <path d="M-9 -8 9 0 -9 8Z" transform="translate(94 713) rotate(90)"/>
      </g>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle" fill="#2b7fff">
        <rect x="72" y="390" width="44" height="44" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
        <text x="94" y="418">01</text>
        <rect x="72" y="488" width="44" height="44" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
        <text x="94" y="516">02</text>
        <rect x="72" y="630" width="44" height="44" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
        <text x="94" y="658">03</text>
        <rect x="72" y="728" width="44" height="44" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
        <text x="94" y="756">04</text>
      </g>
    </g>

    <!-- step cards -->
    <g>
      <!-- 01 -->
      <rect x="136" y="372" width="1002" height="80" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="160" y="406" font-size="22" font-weight="700" fill="#fafafa">Analyze codebase</text>
      <text x="160" y="432" font-size="18" fill="#a1a1a1">Creates or refreshes CODEBASE.md</text>
      <rect x="804" y="390" width="316" height="44" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="962" y="418" font-size="17" text-anchor="middle" fill="#2b7fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/ohmyorch:analyze-codebase</text>

      <!-- 02 -->
      <rect x="136" y="470" width="1002" height="80" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="160" y="504" font-size="22" font-weight="700" fill="#fafafa">Generate or ingest intent</text>
      <text x="160" y="530" font-size="18" fill="#a1a1a1">Writes PRD.md, then SPECS.md</text>
      <rect x="586" y="488" width="268" height="44" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="720" y="516" font-size="17" text-anchor="middle" fill="#2b7fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/ohmyorch:generate-prd</text>
      <rect x="864" y="488" width="256" height="44" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="992" y="516" font-size="17" text-anchor="middle" fill="#2b7fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/ohmyorch:ingest-spec</text>

      <!-- 03 -->
      <rect x="136" y="612" width="1002" height="80" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="160" y="646" font-size="22" font-weight="700" fill="#fafafa">Deliver one READY story</text>
      <text x="160" y="672" font-size="18" fill="#a1a1a1">One OpenSpec change, then the story is DONE</text>
      <rect x="828" y="630" width="292" height="44" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="974" y="658" font-size="17" text-anchor="middle" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#2b7fff">/ohmyorch:deliver</tspan> US-1.1</text>

      <!-- 04 -->
      <rect x="136" y="710" width="1002" height="80" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="160" y="744" font-size="22" font-weight="700" fill="#fafafa">Resume</text>
      <text x="160" y="770" font-size="18" fill="#a1a1a1">With no argument, it resumes the recorded goal</text>
      <rect x="910" y="728" width="210" height="44" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="1015" y="756" font-size="17" text-anchor="middle" fill="#2b7fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/ohmyorch:deliver</text>
    </g>

    <!-- the READY contract, between intent (01-02) and execution (03-04) -->
    <g>
      <circle cx="94" cy="581" r="11" fill="#5ee9b5" fill-opacity="0.14"/>
      <circle cx="94" cy="581" r="5" fill="#5ee9b5"/>
      <path d="M109 581H130" stroke="#5ee9b5" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
      <rect x="136" y="564" width="128" height="34" rx="17" fill="#00bc7d" fill-opacity="0.16" stroke="#5ee9b5" stroke-opacity="0.45"/>
      <use href="#i-check" x="152" y="572" width="18" height="18" color="#5ee9b5"/>
      <text x="213" y="587" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#5ee9b5">READY</text>
      <text x="280" y="587" font-size="18" fill="#a1a1a1">requires at least one <tspan fill="#fafafa">Given / When / Then</tspan> scenario and a <tspan fill="#fafafa">Source:</tspan> reference</text>
    </g>

    <!-- epic delivery -->
    <g>
      <rect x="1158" y="372" width="370" height="418" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.14"/>
      <rect x="1178" y="396" width="48" height="48" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
      <use href="#i-layers" x="1189" y="407" width="26" height="26" color="#2b7fff"/>
      <text x="1242" y="416" font-size="22" font-weight="700" fill="#fafafa">Epic delivery</text>
      <text x="1242" y="442" font-size="18" fill="#a1a1a1">Every story of one epic</text>

      <rect x="1178" y="470" width="330" height="44" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="1343" y="498" font-size="17" text-anchor="middle" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#2b7fff">/ohmyorch:deliver</tspan> EPIC-1</text>

      <rect x="1178" y="552" width="40" height="40" rx="12" fill="#5ee9b5" fill-opacity="0.12"/>
      <use href="#i-list" x="1187" y="561" width="22" height="22" color="#5ee9b5"/>
      <text x="1232" y="566" font-size="18" font-weight="600" fill="#fafafa">Story by story</text>
      <text x="1232" y="590" font-size="18" fill="#a1a1a1">in SPECS.md order</text>

      <rect x="1178" y="634" width="40" height="40" rx="12" fill="#5ee9b5" fill-opacity="0.12"/>
      <use href="#i-file" x="1187" y="643" width="22" height="22" color="#5ee9b5"/>
      <text x="1232" y="648" font-size="18" font-weight="600" fill="#fafafa">One change per story</text>
      <text x="1232" y="672" font-size="18" fill="#a1a1a1">one active at a time</text>

      <rect x="1178" y="716" width="40" height="40" rx="12" fill="#5ee9b5" fill-opacity="0.12"/>
      <use href="#i-user" x="1187" y="725" width="22" height="22" color="#5ee9b5"/>
      <text x="1232" y="730" font-size="18" font-weight="600" fill="#fafafa">Owned by one session</text>
      <text x="1232" y="754" font-size="18" fill="#a1a1a1">another needs <tspan font-size="16" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--takeover</tspan></text>
    </g>

    <!-- footer -->
    <rect x="72" y="822" width="1456" height="1" fill="#ffffff" fill-opacity="0.10"/>
    <text x="72" y="864" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#fafafa">Oh<tspan fill="url(#hl)">My</tspan>Orch</text>
    <text x="800" y="862" font-size="15" letter-spacing="3" text-anchor="middle" fill="#737373">CLAUDE CODE + OPENSPEC</text>
    <g transform="translate(1408 844) scale(0.6)" fill-rule="evenodd">
      <g fill="#c92b60">
        <path d="M26.8 5.8C26.8 5.3 26.4 5.1 25.9 5.3C22.3 6.5 20.8 9.1 20.8 12.8V21.2C20.8 26.3 17.8 29.1 12.8 29.1H9.1C6.2 29.1 4.3 31.0 4.1 33.7C4.1 34.0 4.3 34.2 4.7 34.2H12.9C21.6 34.2 26.8 29.2 26.8 21.1Z"/>
        <path d="M40.4 12.5C33.9 12.5 29.3 17.2 29.3 23.5C29.3 29.8 33.9 34.5 40.4 34.5C46.9 34.5 51.5 29.8 51.5 23.5C51.5 17.2 46.9 12.5 40.4 12.5ZM40.4 18.0C43.6 18.0 45.9 20.3 45.9 23.5C45.9 26.7 43.6 29.0 40.4 29.0C37.2 29.0 34.9 26.7 34.9 23.5C34.9 20.3 37.2 18.0 40.4 18.0Z"/>
        <path d="M68.0 14.4C65.8 13.1 63.6 12.5 61.0 12.5C55.9 12.5 52.4 15.2 52.4 19.3C52.4 23.2 55.3 24.7 59.4 25.7L61.4 26.2C63.1 26.6 63.8 27.1 63.8 27.9C63.8 28.9 62.8 29.5 61.1 29.5C58.5 29.5 56.0 28.5 53.8 26.9C53.5 26.7 53.2 26.8 53.0 27.1L51.1 30.4C50.9 30.7 51.0 31.0 51.3 31.2C54.0 33.4 57.5 34.5 61.0 34.5C66.3 34.5 69.7 31.8 69.7 27.5C69.7 23.7 67.0 22.1 62.8 21.1L60.6 20.6C58.9 20.2 58.2 19.7 58.2 18.9C58.2 18.0 59.2 17.5 60.8 17.5C62.7 17.5 64.4 18.0 66.2 19.0C66.5 19.2 66.8 19.1 67.0 18.8L68.2 15.1C68.4 14.8 68.3 14.6 68.0 14.4Z"/>
        <path d="M81.8 12.5C75.3 12.5 70.7 17.2 70.7 23.5C70.7 29.8 75.3 34.5 81.8 34.5C88.3 34.5 92.9 29.8 92.9 23.5C92.9 17.2 88.3 12.5 81.8 12.5ZM81.8 18.0C85.0 18.0 87.3 20.3 87.3 23.5C87.3 26.7 85.0 29.0 81.8 29.0C78.6 29.0 76.3 26.7 76.3 23.5C76.3 20.3 78.6 18.0 81.8 18.0Z"/>
        <path d="M100.2 33.4V23.5C100.2 20.3 102.1 18.4 105.4 18.4H107.4C107.7 18.4 107.9 18.2 107.9 17.9V13.4C107.9 13.1 107.7 12.9 107.4 12.9H105.1C98.5 12.9 94.5 16.9 94.5 23.4V33.4C94.5 33.8 94.7 34.0 95.1 34.0H99.6C100.0 34.0 100.2 33.8 100.2 33.4Z"/>
        <path d="M119.4 12.5C112.9 12.5 108.3 17.2 108.3 23.5C108.3 29.8 112.9 34.5 119.4 34.5C125.9 34.5 130.5 29.8 130.5 23.5C130.5 17.2 125.9 12.5 119.4 12.5ZM119.4 18.0C122.6 18.0 124.9 20.3 124.9 23.5C124.9 26.7 122.6 29.0 119.4 29.0C116.2 29.0 113.9 26.7 113.9 23.5C113.9 20.3 116.2 18.0 119.4 18.0Z"/>
        <path d="M133.0 33.4V22.9C133.0 16.7 137.0 12.5 142.8 12.5C146.1 12.5 148.6 13.8 150.4 15.9C152.2 13.8 154.7 12.5 158.0 12.5C163.8 12.5 167.8 16.7 167.8 22.9V33.4C167.8 33.8 167.6 34.0 167.2 34.0H162.7C162.3 34.0 162.1 33.8 162.1 33.4V23.0C162.1 19.8 160.6 18.0 158.0 18.0C155.4 18.0 153.3 19.8 153.3 23.0V33.4C153.3 33.8 153.1 34.0 152.7 34.0H148.2C147.8 34.0 147.6 33.8 147.6 33.4V23.0C147.6 19.8 145.4 18.0 142.8 18.0C140.2 18.0 138.7 19.8 138.7 23.0V33.4C138.7 33.8 138.5 34.0 138.1 34.0H133.6C133.2 34.0 133.0 33.8 133.0 33.4Z"/>
      </g>
      <path fill="#087fa9" d="M183.6 11.7C176.8 11.7 171.9 16.5 171.9 23.1C171.9 29.6 176.8 34.0 183.6 34.0H194.6C195.0 34.0 195.2 33.8 195.2 33.4V23.1C195.2 16.5 190.3 11.7 183.6 11.7ZM183.6 17.3C187.1 17.3 189.5 19.7 189.5 23.1V28.5H183.6C180.1 28.5 177.6 26.3 177.6 23.1C177.6 19.7 180.1 17.3 183.6 17.3Z"/>
    </g>
  </g>
</svg>
