      <text x="682.4" y="468" font-size="20" font-weight="600" fill="#fafafa">rule references</text>
      <text x="682.4" y="493" font-size="15" fill="#a1a1a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">references/rules/</text>

      <rect x="957.6" y="368" width="275.2" height="146" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
