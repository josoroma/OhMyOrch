<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">OhMyOrch: what the plugin includes</title>
  <desc id="d">The plugin ships 18 skills (17 public and 1 internal), 3 read-only authoring agents, 6 rule references, root hooks with 5 routes and a Bash and jq runtime, and it keeps that installed code apart from the project's own documents, OpenSpec changes, delivery goal record and configuration.</desc>
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b7fff"/>
      <stop offset="1" stop-color="#5ee9b5"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#2b7fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2b7fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#00bc7d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00bc7d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="900" rx="28"/></clipPath>
    <symbol id="i-box" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g></symbol>
    <symbol id="i-slash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 15 6-6"/></g></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></g></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></g></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></g></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></g></symbol>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="#0a0a0a"/>
    <rect width="1600" height="900" fill="url(#glowA)"/>
    <rect width="1600" height="900" fill="url(#glowB)"/>
    <rect x="1318" y="154" width="204" height="48" fill="url(#dots)"/>

    <!-- kicker -->
    <rect x="72" y="64" width="258" height="46" rx="23" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
    <use href="#i-box" x="92" y="76" width="22" height="22" color="#2b7fff"/>
    <text x="128" y="94" font-size="15" font-weight="600" letter-spacing="3" fill="#a1a1a1">WHAT'S INCLUDED</text>
    <text x="1528" y="96" font-size="18" font-weight="500" letter-spacing="2" text-anchor="end" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">07</text>

    <!-- headline -->
    <text x="72" y="204" font-size="72" font-weight="800" letter-spacing="-2" fill="#fafafa">A delivery harness,</text>
    <text x="72" y="282" font-size="72" font-weight="800" letter-spacing="-2" fill="#fafafa"><tspan fill="url(#hl)">not a single command</tspan>.</text>
    <text x="72" y="332" font-size="25" fill="#a1a1a1">Public skills are invoked as <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#2b7fff">/ohmyorch:</tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#fafafa">&lt;name&gt;</tspan>.</text>

    <!-- three of the 17 public skills -->
    <g>
      <rect x="1071" y="226" width="217" height="44" rx="10" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="1179.5" y="254" font-size="17" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#fafafa"><tspan fill="#2b7fff">/ohmyorch:</tspan>doctor</text>
      <rect x="1300" y="226" width="228" height="44" rx="10" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="1414" y="254" font-size="17" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#fafafa"><tspan fill="#2b7fff">/ohmyorch:</tspan>deliver</text>
      <rect x="1120" y="282" width="276" height="44" rx="10" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="1258" y="310" font-size="17" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#fafafa"><tspan fill="#2b7fff">/ohmyorch:</tspan>opsx-verify</text>
      <rect x="1408" y="282" width="120" height="44" rx="10" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="1468" y="310" font-size="16" text-anchor="middle" fill="#a1a1a1">+ 14 more</text>
    </g>

