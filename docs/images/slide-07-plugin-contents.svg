      <g font-size="20" fill="#fafafa">
        <text x="404" y="593">skills and agents</text>
        <text x="404" y="631">hook dispatcher</text>
        <text x="404" y="669">Bash and jq runtime</text>
        <text x="404" y="707">shared contract and rules</text>
        <text x="404" y="745">neutral templates</text>
      </g>
    </g>

    <!-- project-owned -->
    <g>
      <rect x="810" y="534" width="718" height="256" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="838" y="596" width="60" height="60" rx="12" fill="#5ee9b5" fill-opacity="0.12"/>
