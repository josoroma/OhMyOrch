<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">OhMyOrch: the publisher repository is not a consumer project</title>
  <desc id="d">Maintainers validate the plugin with npm and claude plugin validate commands, using Node.js 22 or newer and Python 3 for development only. The packaging allowlist leaves out publisher docs, tools, tests, project state and local settings, and Pages publishes only the redirect, the guide and its assets.</desc>
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b7fff"/>
      <stop offset="1" stop-color="#5ee9b5"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#2b7fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2b7fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#00bc7d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00bc7d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="900" rx="28"/></clipPath>
    <symbol id="i-box" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></g></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></g></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></g></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></g></symbol>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="#0a0a0a"/>
    <rect width="1600" height="900" fill="url(#glowA)"/>
    <rect width="1600" height="900" fill="url(#glowB)"/>
    <rect x="1328" y="146" width="200" height="110" fill="url(#dots)"/>

    <!-- kicker -->
    <rect x="72" y="64" width="290" height="46" rx="23" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
    <use href="#i-box" x="92" y="76" width="22" height="22" color="#2b7fff"/>
    <text x="128" y="94" font-size="15" font-weight="600" letter-spacing="3" fill="#a1a1a1">WORK ON THE PLUGIN</text>
    <text x="1528" y="96" font-size="18" font-weight="500" letter-spacing="2" text-anchor="end" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">09</text>

    <!-- headline -->
    <text x="72" y="204" font-size="64" font-weight="800" letter-spacing="-2" fill="#fafafa">Publisher repo ≠ <tspan fill="url(#hl)">consumer project</tspan>.</text>
    <text x="72" y="252" font-size="25" fill="#a1a1a1">Consumer scaffolding is created explicitly; maintainer tooling stays separate.</text>

    <!-- maintainer checks -->
    <g>
      <rect x="72" y="284" width="920" height="428" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="96" y="304" width="48" height="48" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
      <use href="#i-terminal" x="108" y="316" width="24" height="24" color="#2b7fff"/>
      <text x="160" y="336" font-size="22" font-weight="700" fill="#fafafa">Maintainer checks</text>

      <rect x="96" y="368" width="872" height="320" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="96" y="404" width="872" height="1" fill="#ffffff" fill-opacity="0.10"/>
      <g fill="#ffffff" fill-opacity="0.16">
        <circle cx="120" cy="386" r="5.5"/>
        <circle cx="140" cy="386" r="5.5"/>
        <circle cx="160" cy="386" r="5.5"/>
      </g>
      <text x="944" y="391" font-size="15" letter-spacing="1" text-anchor="end" fill="#a1a1a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">publisher checkout</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#fafafa">
        <g fill="#737373">
          <text x="120" y="440">$</text>
          <text x="120" y="472">$</text>
          <text x="120" y="504">$</text>
          <text x="120" y="536">$</text>
          <text x="120" y="568">$</text>
          <text x="120" y="600">$</text>
          <text x="120" y="632">$</text>
          <text x="120" y="664">$</text>
        </g>
        <text x="148" y="440"><tspan fill="#2b7fff">npm</tspan> ci --ignore-scripts</text>
        <text x="148" y="472"><tspan fill="#2b7fff">npm</tspan> run docs:build</text>
        <text x="148" y="504"><tspan fill="#2b7fff">npm</tspan> run check</text>
        <text x="148" y="536"><tspan fill="#2b7fff">npm</tspan> test</text>
        <text x="148" y="568"><tspan fill="#2b7fff">npm</tspan> run test:marketplace</text>
        <text x="148" y="600"><tspan fill="#2b7fff">claude</tspan> plugin validate --strict --json plugins/ohmyorch</text>
        <text x="148" y="632"><tspan fill="#2b7fff">claude</tspan> plugin validate --strict --json .claude-plugin/marketplace.json</text>
        <text x="148" y="664"><tspan fill="#2b7fff">npm</tspan> run package:plugin -- --development</text>
      </g>
    </g>

    <!-- maintainer-only tools -->
    <g>
      <rect x="1012" y="284" width="516" height="186" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="1036" y="304" width="48" height="48" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
      <use href="#i-wrench" x="1048" y="316" width="24" height="24" color="#2b7fff"/>
      <text x="1100" y="336" font-size="22" font-weight="700" fill="#fafafa">Maintainer-only tools</text>

      <rect x="1036" y="366" width="226" height="52" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="1149" y="398" font-size="18" font-weight="600" text-anchor="middle" fill="#fafafa">Node.js <tspan font-size="17" font-weight="400" fill="#2b7fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&gt;=22</tspan></text>

      <rect x="1278" y="366" width="226" height="52" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="1391" y="398" font-size="18" font-weight="600" text-anchor="middle" fill="#fafafa">Python <tspan font-size="17" font-weight="400" fill="#2b7fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3</tspan></text>

      <text x="1036" y="448" font-size="18" fill="#a1a1a1">Development only, never at runtime.</text>
    </g>

    <!-- packaging excludes -->
    <g>
      <rect x="1012" y="490" width="516" height="222" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="1036" y="510" width="48" height="48" rx="12" fill="#5ee9b5" fill-opacity="0.12"/>
      <use href="#i-minus" x="1048" y="522" width="24" height="24" color="#5ee9b5"/>
      <text x="1100" y="542" font-size="22" font-weight="700" fill="#fafafa">Packaging excludes</text>

      <g fill="#737373">
        <rect x="1040" y="585" width="12" height="2" rx="1"/>
        <rect x="1040" y="615" width="12" height="2" rx="1"/>
        <rect x="1040" y="645" width="12" height="2" rx="1"/>
        <rect x="1040" y="675" width="12" height="2" rx="1"/>
      </g>
      <g font-size="18" fill="#a1a1a1">
        <text x="1068" y="592">Publisher docs and generated pages</text>
        <text x="1068" y="622">Tools, tests and fixtures</text>
        <text x="1068" y="652">Project state, snapshots and caches</text>
        <text x="1068" y="682">Local .claude settings and backups</text>
      </g>
    </g>

    <!-- pages -->
    <g>
      <rect x="72" y="732" width="1456" height="58" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="92" y="743" width="36" height="36" rx="10" fill="#5ee9b5" fill-opacity="0.12"/>
      <use href="#i-book" x="100" y="751" width="20" height="20" color="#5ee9b5"/>
      <text x="144" y="768" font-size="20" fill="#a1a1a1"><tspan font-weight="700" fill="#fafafa">Pages</tspan> publishes only the redirect, the guide and its assets.</text>
      <text x="1504" y="768" font-size="16" text-anchor="end" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#a1a1a1">index.html</tspan> · <tspan fill="#a1a1a1">docs/OhMyOrch.html</tspan> · <tspan fill="#a1a1a1">docs/assets/</tspan> · <tspan fill="#a1a1a1">docs/images/</tspan></text>
    </g>

    <!-- footer -->
    <rect x="72" y="822" width="1456" height="1" fill="#ffffff" fill-opacity="0.10"/>
    <text x="72" y="864" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#fafafa">Oh<tspan fill="url(#hl)">My</tspan>Orch</text>
    <text x="800" y="862" font-size="15" letter-spacing="3" text-anchor="middle" fill="#737373">CLAUDE CODE + OPENSPEC</text>
