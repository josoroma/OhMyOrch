<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">OhMyOrch delivery: four steps, one clear next action</title>
  <desc id="d">Each READY story in SPECS.md becomes one OpenSpec change that goes through propose, apply, verify and archive, then the story is marked DONE. A CRITICAL verify finding becomes a new unticked task and returns the change to apply. The deliver command runs the whole loop for an epic, a story or a task, and derives one of six actions on every call.</desc>
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b7fff"/>
      <stop offset="1" stop-color="#5ee9b5"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#2b7fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2b7fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#00bc7d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00bc7d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="900" rx="28"/></clipPath>
    <symbol id="i-repeat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></g></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></g></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g></symbol>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="#0a0a0a"/>
    <rect width="1600" height="900" fill="url(#glowA)"/>
    <rect width="1600" height="900" fill="url(#glowB)"/>
    <rect x="1340" y="146" width="200" height="112" fill="url(#dots)"/>

    <!-- kicker -->
    <rect x="72" y="64" width="300" height="46" rx="23" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
    <use href="#i-repeat" x="92" y="76" width="22" height="22" color="#2b7fff"/>
    <text x="128" y="94" font-size="15" font-weight="600" letter-spacing="3" fill="#a1a1a1">HOW DELIVERY WORKS</text>
    <text x="1528" y="96" font-size="18" font-weight="500" letter-spacing="2" text-anchor="end" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">02</text>

    <!-- headline -->
    <text x="72" y="208" font-size="64" font-weight="800" letter-spacing="-2" fill="#fafafa">Four steps. <tspan fill="url(#hl)">One clear next action.</tspan></text>
    <text x="72" y="256" font-size="25" fill="#a1a1a1">Each READY story in SPECS.md becomes one OpenSpec change.</text>

    <!-- step 1: propose -->
    <g>
      <rect x="72" y="306" width="300" height="258" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="88" y="324" width="56" height="56" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
      <use href="#i-bulb" x="102" y="338" width="28" height="28" color="#2b7fff"/>
      <text x="160" y="346" font-size="15" font-weight="600" letter-spacing="3" fill="#a1a1a1">STEP 1</text>
      <text x="160" y="373" font-size="22" font-weight="700" fill="#fafafa">Propose</text>
      <rect x="88" y="396" width="268" height="40" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="100" y="421" font-size="16" fill="#2b7fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/ohmyorch:opsx-propose</text>
      <text font-size="18" fill="#a1a1a1">
        <tspan x="88" y="468">Writes proposal.md,</tspan>
        <tspan x="88" y="493">specs/ and tasks.md.</tspan>
        <tspan x="88" y="518">Adds design.md only</tspan>
        <tspan x="88" y="543">when needed.</tspan>
      </text>
    </g>

    <!-- step 2: apply -->
    <g>
      <rect x="402" y="306" width="300" height="258" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="418" y="324" width="56" height="56" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
      <use href="#i-code" x="432" y="338" width="28" height="28" color="#2b7fff"/>
      <text x="490" y="346" font-size="15" font-weight="600" letter-spacing="3" fill="#a1a1a1">STEP 2</text>
      <text x="490" y="373" font-size="22" font-weight="700" fill="#fafafa">Apply</text>
      <rect x="418" y="396" width="268" height="40" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="430" y="421" font-size="16" fill="#2b7fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/ohmyorch:opsx-apply</text>
      <text font-size="18" fill="#a1a1a1">
        <tspan x="418" y="468">Implements the tasks</tspan>
        <tspan x="418" y="493">and ticks each one in</tspan>
        <tspan x="418" y="518">tasks.md only when it</tspan>
        <tspan x="418" y="543">is really done.</tspan>
      </text>
    </g>

    <!-- step 3: verify -->
    <g>
      <rect x="732" y="306" width="300" height="258" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="748" y="324" width="56" height="56" rx="12" fill="#5ee9b5" fill-opacity="0.12"/>
      <use href="#i-search" x="762" y="338" width="28" height="28" color="#5ee9b5"/>
      <text x="820" y="346" font-size="15" font-weight="600" letter-spacing="3" fill="#a1a1a1">STEP 3</text>
      <text x="820" y="373" font-size="22" font-weight="700" fill="#fafafa">Verify</text>
      <rect x="748" y="396" width="268" height="40" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="760" y="421" font-size="16" fill="#2b7fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/ohmyorch:opsx-verify</text>
      <text font-size="18" fill="#a1a1a1">
        <tspan x="748" y="468">Advisory check of the</tspan>
        <tspan x="748" y="493">implementation against</tspan>
        <tspan x="748" y="518">the change.</tspan>
        <tspan x="748" y="543">Writes no file.</tspan>
      </text>
    </g>

    <!-- step 4: archive -->
    <g>
      <rect x="1062" y="306" width="300" height="258" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="1078" y="324" width="56" height="56" rx="12" fill="#5ee9b5" fill-opacity="0.12"/>
      <use href="#i-archive" x="1092" y="338" width="28" height="28" color="#5ee9b5"/>
      <text x="1150" y="346" font-size="15" font-weight="600" letter-spacing="3" fill="#a1a1a1">STEP 4</text>
      <text x="1150" y="373" font-size="22" font-weight="700" fill="#fafafa">Archive</text>
      <rect x="1078" y="396" width="268" height="40" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="1090" y="421" font-size="16" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#2b7fff">openspec</tspan> archive &lt;id&gt; -y</text>
      <text font-size="18" fill="#a1a1a1">
        <tspan x="1078" y="468">Merges the delta specs</tspan>
        <tspan x="1078" y="493">into openspec/specs/,</tspan>
        <tspan x="1078" y="518">moves the change to</tspan>
        <tspan x="1078" y="543">changes/archive/.</tspan>
      </text>
    </g>

    <!-- forward arrows -->
    <g>
      <g stroke="#5ee9b5" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round">
        <path d="M376 435H386"/>
        <path d="M706 435H716"/>
        <path d="M1036 435H1046"/>
        <path d="M1366 435H1376"/>
      </g>
      <g fill="#5ee9b5">
        <path d="M-9 -8 9 0 -9 8Z" transform="translate(391 435) scale(0.8)"/>
        <path d="M-9 -8 9 0 -9 8Z" transform="translate(721 435) scale(0.8)"/>
        <path d="M-9 -8 9 0 -9 8Z" transform="translate(1051 435) scale(0.8)"/>
        <path d="M-9 -8 9 0 -9 8Z" transform="translate(1381 435) scale(0.8)"/>
      </g>
    </g>

    <!-- done marker -->
    <g>
      <text x="1460" y="358" font-size="16" text-anchor="middle" fill="#a1a1a1">Story marked</text>
      <rect x="1392" y="379" width="136" height="112" rx="14" fill="#00bc7d" fill-opacity="0.16" stroke="#5ee9b5" stroke-opacity="0.45"/>
      <use href="#i-check" x="1442" y="399" width="36" height="36" color="#5ee9b5"/>
      <text x="1461" y="468" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle" fill="#5ee9b5">DONE</text>
      <text x="1460" y="518" font-size="16" text-anchor="middle" fill="#a1a1a1">in SPECS.md</text>
    </g>

    <!-- verify back to apply -->
    <g>
      <path d="M1002 570V590Q1002 604 988 604H446Q432 604 432 590V580" fill="none" stroke="#5ee9b5" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
      <path d="M-9 -8 9 0 -9 8Z" transform="translate(432 577) rotate(-90) scale(0.8)" fill="#5ee9b5"/>
      <rect x="519" y="586" width="396" height="36" rx="18" fill="#171717" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="717" y="610" font-size="16" text-anchor="middle" fill="#a1a1a1"><tspan font-weight="700" fill="#fafafa">CRITICAL</tspan> finding adds an unticked task</text>
    </g>

    <!-- deliver strip -->
    <g>
      <rect x="72" y="668" width="1456" height="122" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>

      <text x="96" y="706" font-size="15" font-weight="600" letter-spacing="2" fill="#a1a1a1">RUN THE WHOLE LOOP</text>
      <rect x="96" y="722" width="310" height="40" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="112" y="747" font-size="16" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#2b7fff">/ohmyorch:deliver</tspan> &lt;target&gt;</text>

      <rect x="442" y="694" width="1" height="70" fill="#ffffff" fill-opacity="0.10"/>

      <text x="479" y="706" font-size="15" font-weight="600" letter-spacing="2" fill="#a1a1a1">TARGET: EPIC, STORY, TASK</text>
      <g font-size="16" text-anchor="middle" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <rect x="479" y="724" width="88" height="36" rx="18" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="523" y="747">EPIC-1</text>
        <rect x="577" y="724" width="88" height="36" rx="18" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="621" y="747">US-1.1</text>
        <rect x="675" y="724" width="108" height="36" rx="18" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="729" y="747">US-1.1#2</text>
      </g>

      <rect x="820" y="694" width="1" height="70" fill="#ffffff" fill-opacity="0.10"/>

      <text x="856" y="706" font-size="15" font-weight="600" letter-spacing="2" fill="#a1a1a1">NEXT ACTION: ONE OF SIX, DERIVED ON EVERY CALL</text>
      <g font-size="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <rect x="856" y="724" width="98" height="36" rx="18" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="905" y="747" fill="#2b7fff">propose</text>
        <rect x="964" y="724" width="78" height="36" rx="18" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="1003" y="747" fill="#2b7fff">apply</text>
        <rect x="1052" y="724" width="88" height="36" rx="18" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="1096" y="747" fill="#2b7fff">verify</text>
        <rect x="1150" y="724" width="118" height="36" rx="18" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="1209" y="747" fill="#5ee9b5">mark-done</text>
        <rect x="1278" y="724" width="108" height="36" rx="18" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="1332" y="747" fill="#ff6467">escalate</text>
        <rect x="1396" y="724" width="108" height="36" rx="18" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
        <text x="1450" y="747" fill="#5ee9b5">complete</text>
      </g>
    </g>

    <!-- footer -->
    <rect x="72" y="822" width="1456" height="1" fill="#ffffff" fill-opacity="0.10"/>
    <text x="72" y="864" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#fafafa">Oh<tspan fill="url(#hl)">My</tspan>Orch</text>
    <text x="800" y="862" font-size="15" letter-spacing="3" text-anchor="middle" fill="#737373">CLAUDE CODE + OPENSPEC</text>
    <g transform="translate(1408 844) scale(0.6)" fill-rule="evenodd">
      <g fill="#c92b60">
        <path d="M26.8 5.8C26.8 5.3 26.4 5.1 25.9 5.3C22.3 6.5 20.8 9.1 20.8 12.8V21.2C20.8 26.3 17.8 29.1 12.8 29.1H9.1C6.2 29.1 4.3 31.0 4.1 33.7C4.1 34.0 4.3 34.2 4.7 34.2H12.9C21.6 34.2 26.8 29.2 26.8 21.1Z"/>
        <path d="M40.4 12.5C33.9 12.5 29.3 17.2 29.3 23.5C29.3 29.8 33.9 34.5 40.4 34.5C46.9 34.5 51.5 29.8 51.5 23.5C51.5 17.2 46.9 12.5 40.4 12.5ZM40.4 18.0C43.6 18.0 45.9 20.3 45.9 23.5C45.9 26.7 43.6 29.0 40.4 29.0C37.2 29.0 34.9 26.7 34.9 23.5C34.9 20.3 37.2 18.0 40.4 18.0Z"/>
        <path d="M68.0 14.4C65.8 13.1 63.6 12.5 61.0 12.5C55.9 12.5 52.4 15.2 52.4 19.3C52.4 23.2 55.3 24.7 59.4 25.7L61.4 26.2C63.1 26.6 63.8 27.1 63.8 27.9C63.8 28.9 62.8 29.5 61.1 29.5C58.5 29.5 56.0 28.5 53.8 26.9C53.5 26.7 53.2 26.8 53.0 27.1L51.1 30.4C50.9 30.7 51.0 31.0 51.3 31.2C54.0 33.4 57.5 34.5 61.0 34.5C66.3 34.5 69.7 31.8 69.7 27.5C69.7 23.7 67.0 22.1 62.8 21.1L60.6 20.6C58.9 20.2 58.2 19.7 58.2 18.9C58.2 18.0 59.2 17.5 60.8 17.5C62.7 17.5 64.4 18.0 66.2 19.0C66.5 19.2 66.8 19.1 67.0 18.8L68.2 15.1C68.4 14.8 68.3 14.6 68.0 14.4Z"/>
        <path d="M81.8 12.5C75.3 12.5 70.7 17.2 70.7 23.5C70.7 29.8 75.3 34.5 81.8 34.5C88.3 34.5 92.9 29.8 92.9 23.5C92.9 17.2 88.3 12.5 81.8 12.5ZM81.8 18.0C85.0 18.0 87.3 20.3 87.3 23.5C87.3 26.7 85.0 29.0 81.8 29.0C78.6 29.0 76.3 26.7 76.3 23.5C76.3 20.3 78.6 18.0 81.8 18.0Z"/>
        <path d="M100.2 33.4V23.5C100.2 20.3 102.1 18.4 105.4 18.4H107.4C107.7 18.4 107.9 18.2 107.9 17.9V13.4C107.9 13.1 107.7 12.9 107.4 12.9H105.1C98.5 12.9 94.5 16.9 94.5 23.4V33.4C94.5 33.8 94.7 34.0 95.1 34.0H99.6C100.0 34.0 100.2 33.8 100.2 33.4Z"/>
        <path d="M119.4 12.5C112.9 12.5 108.3 17.2 108.3 23.5C108.3 29.8 112.9 34.5 119.4 34.5C125.9 34.5 130.5 29.8 130.5 23.5C130.5 17.2 125.9 12.5 119.4 12.5ZM119.4 18.0C122.6 18.0 124.9 20.3 124.9 23.5C124.9 26.7 122.6 29.0 119.4 29.0C116.2 29.0 113.9 26.7 113.9 23.5C113.9 20.3 116.2 18.0 119.4 18.0Z"/>
        <path d="M133.0 33.4V22.9C133.0 16.7 137.0 12.5 142.8 12.5C146.1 12.5 148.6 13.8 150.4 15.9C152.2 13.8 154.7 12.5 158.0 12.5C163.8 12.5 167.8 16.7 167.8 22.9V33.4C167.8 33.8 167.6 34.0 167.2 34.0H162.7C162.3 34.0 162.1 33.8 162.1 33.4V23.0C162.1 19.8 160.6 18.0 158.0 18.0C155.4 18.0 153.3 19.8 153.3 23.0V33.4C153.3 33.8 153.1 34.0 152.7 34.0H148.2C147.8 34.0 147.6 33.8 147.6 33.4V23.0C147.6 19.8 145.4 18.0 142.8 18.0C140.2 18.0 138.7 19.8 138.7 23.0V33.4C138.7 33.8 138.5 34.0 138.1 34.0H133.6C133.2 34.0 133.0 33.8 133.0 33.4Z"/>
      </g>
      <path fill="#087fa9" d="M183.6 11.7C176.8 11.7 171.9 16.5 171.9 23.1C171.9 29.6 176.8 34.0 183.6 34.0H194.6C195.0 34.0 195.2 33.8 195.2 33.4V23.1C195.2 16.5 190.3 11.7 183.6 11.7ZM183.6 17.3C187.1 17.3 189.5 19.7 189.5 23.1V28.5H183.6C180.1 28.5 177.6 26.3 177.6 23.1C177.6 19.7 180.1 17.3 183.6 17.3Z"/>
    </g>
  </g>
</svg>
