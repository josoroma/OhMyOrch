<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">OhMyOrch skill map: start with the job you need to do</title>
  <desc id="d">The 19 public OhMyOrch skills grouped by job: understand code and intent (analyze-codebase, generate-prd, ingest-spec), deliver or resume (deliver), work on one change (opsx-explore, opsx-propose, opsx-apply, opsx-verify, opsx-update, opsx-sync, opsx-archive), set up and maintain (doctor, bootstrap, adapt-project, post-install, upgrade-project), reset or migrate (harness-reset, migrate-legacy) and present (generate-html-page), each invoked as /ohmyorch:name.</desc>
