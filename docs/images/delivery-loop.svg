<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 626" role="img" aria-labelledby="title description">
  <title id="title">One story, one OpenSpec change, four steps</title>
  <desc id="description">Select a READY story from the SPECS backlog. Propose the change, apply its tasks, verify the implementation, and archive the change. After the archive, mark the story DONE and continue with the next story. A CRITICAL verify finding becomes a new unticked task, which returns the change to apply.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#101b32"/><stop offset="1" stop-color="#111127"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#89a1c9" stroke-width="1.5"/></marker>
    <marker id="repair" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#c4b5fd" stroke-width="1.5"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .card{fill:#15223b;stroke:#324566;stroke-width:1.5}
      .name{fill:#f1f5ff;font-size:21px;font-weight:650}
      .detail{fill:#bac9e0;font-size:15px}
      .badge{fill:#0d1629;stroke:#67e8f9;stroke-width:1.5}
      .number{fill:#67e8f9;font-size:17px;font-weight:700;text-anchor:middle}
      .flow{fill:none;stroke:#89a1c9;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1080" height="626" rx="28" fill="url(#surface)"/>
  <rect x="1" y="1" width="1078" height="624" rx="27" fill="none" stroke="#34425d"/>
  <rect x="40" y="38" width="52" height="4" rx="2" fill="url(#accent)"/>
  <text x="40" y="82" fill="#f1f5ff" font-size="30" font-weight="700">One story. One change. Four steps.</text>
  <text x="40" y="110" class="detail">One OpenSpec change per story · the next action is derived from project files</text>

  <path class="flow" d="M340 195H382"/>
  <path class="flow" d="M690 195H732"/>
  <path class="flow" d="M1000 256V348"/>
  <path class="flow" d="M740 417H698"/>
  <path class="flow" d="M390 417H348"/>

  <rect x="40" y="134" width="300" height="122" rx="16" fill="#19203b" stroke="#a78bfa" stroke-width="1.5"/>
  <text class="name" x="60" y="173">Select a READY story</text>
  <text class="detail" x="60" y="207">From the SPECS.md backlog</text>
  <text class="detail" x="60" y="231">One story, one OpenSpec change</text>

  <rect class="card" x="390" y="134" width="300" height="122" rx="16"/>
  <circle class="badge" cx="420" cy="166" r="16"/><text class="number" x="420" y="172">1</text>
  <text class="name" x="448" y="173">Propose</text>
  <text class="detail" x="410" y="207">proposal.md · specs/ · tasks.md</text>
  <text class="detail" x="410" y="231">design.md only when needed</text>

  <rect class="card" x="740" y="134" width="300" height="122" rx="16"/>
  <circle class="badge" cx="770" cy="166" r="16"/><text class="number" x="770" y="172">2</text>
  <text class="name" x="798" y="173">Apply</text>
  <text class="detail" x="760" y="207">Implement the pending tasks</text>
  <text class="detail" x="760" y="231">Tick each one in tasks.md</text>

  <rect class="card" x="740" y="356" width="300" height="122" rx="16"/>
  <circle class="badge" cx="770" cy="388" r="16"/><text class="number" x="770" y="394">3</text>
  <text class="name" x="798" y="395">Verify</text>
  <text class="detail" x="760" y="429">Advisory check of the change</text>
  <text class="detail" x="760" y="453">Writes no file</text>

  <rect class="card" x="390" y="356" width="300" height="122" rx="16"/>
  <circle class="badge" cx="420" cy="388" r="16"/><text class="number" x="420" y="394">4</text>
  <text class="name" x="448" y="395">Archive</text>
  <text class="detail" x="410" y="429">openspec archive &lt;id&gt; -y</text>
  <text class="detail" x="410" y="453">Merges specs · moves the change</text>

  <rect x="40" y="356" width="300" height="122" rx="16" fill="#122e32" stroke="#5eead4" stroke-width="1.5"/>
  <text x="60" y="395" fill="#99f6e4" font-size="21" font-weight="700">Mark the story DONE</text>
  <text class="detail" x="60" y="429">Status: DONE in SPECS.md</text>
  <text class="detail" x="60" y="453">Then the next story in the epic</text>

  <path d="M800 356V263" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#repair)"/>
  <rect x="642" y="292" width="316" height="28" rx="14" fill="#241e42"/>
  <text x="800" y="311" text-anchor="middle" fill="#ddd6fe" font-size="14">CRITICAL finding → new task → apply</text>

  <rect x="40" y="510" width="1000" height="76" rx="16" fill="#0e172b" stroke="#34425d"/>
  <text x="60" y="541" fill="#e0e7ff" font-size="17" font-weight="650">tasks.md is the only tracker. Resume from the files.</text>
  <text class="detail" x="60" y="566">Archive needs every task ticked · DONE needs the archived change · a missing decision stops the loop</text>
</svg>
