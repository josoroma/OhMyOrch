<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">OhMyOrch: files, not chat memory</title>
  <desc id="d">Delivery state lives in project files: the next action is derived from SPECS.md and the change directory on every call, tasks.md is the only progress tracker, verify writes no file, two guards enforce archive before DONE, and a stop for a human decision records BLOCKED with its reason.</desc>
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b7fff"/>
      <stop offset="1" stop-color="#5ee9b5"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#2b7fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2b7fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#00bc7d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00bc7d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="900" rx="28"/></clipPath>
    <symbol id="i-db" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></g></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></g></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86z"/><path d="M12 8v4"/><path d="M12 16h.01"/></g></symbol>
    <symbol id="i-ban" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></g></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></g></symbol>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="#0a0a0a"/>
    <rect width="1600" height="900" fill="url(#glowA)"/>
    <rect width="1600" height="900" fill="url(#glowB)"/>
    <rect x="1340" y="150" width="200" height="110" fill="url(#dots)"/>

    <!-- kicker -->
    <rect x="72" y="64" width="240" height="46" rx="23" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
    <use href="#i-db" x="92" y="76" width="22" height="22" color="#2b7fff"/>
    <text x="128" y="94" font-size="15" font-weight="600" letter-spacing="3" fill="#a1a1a1">WHY IT RESUMES</text>
    <text x="1528" y="96" font-size="18" font-weight="500" letter-spacing="2" text-anchor="end" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03</text>

    <!-- headline -->
    <text x="72" y="208" font-size="72" font-weight="800" letter-spacing="-2" fill="#fafafa">Files, <tspan fill="url(#hl)">not chat memory</tspan>.</text>
    <text x="72" y="256" font-size="25" fill="#a1a1a1">The next action is derived from SPECS.md and the change directory on every call.</text>

    <!-- row 1: three property cards -->
    <g>
      <rect x="72" y="300" width="472" height="148" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="96" y="324" width="64" height="64" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
      <use href="#i-refresh" x="112" y="340" width="32" height="32" color="#2b7fff"/>
      <text x="180" y="335" font-size="15" font-weight="600" letter-spacing="2" fill="#a1a1a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">01</text>
      <text x="180" y="365" font-size="22" font-weight="700" fill="#fafafa">Derived next action</text>
      <text x="180" y="395" font-size="18" fill="#a1a1a1">Recomputed on every call,</text>
      <text x="180" y="421" font-size="18" fill="#a1a1a1">never remembered.</text>

      <rect x="564" y="300" width="472" height="148" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="588" y="324" width="64" height="64" rx="12" fill="#5ee9b5" fill-opacity="0.12"/>
      <use href="#i-tasks" x="604" y="340" width="32" height="32" color="#5ee9b5"/>
      <text x="672" y="335" font-size="15" font-weight="600" letter-spacing="2" fill="#a1a1a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">02</text>
      <text x="672" y="365" font-size="22" font-weight="700" fill="#fafafa">One progress tracker</text>
      <text x="672" y="395" font-size="18" fill="#a1a1a1"><tspan font-size="17" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tasks.md</tspan>: a task is ticked</text>
      <text x="672" y="421" font-size="18" fill="#a1a1a1">only when it is really done.</text>

      <rect x="1056" y="300" width="472" height="148" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="1080" y="324" width="64" height="64" rx="12" fill="#5ee9b5" fill-opacity="0.12"/>
      <use href="#i-search" x="1096" y="340" width="32" height="32" color="#5ee9b5"/>
      <text x="1164" y="335" font-size="15" font-weight="600" letter-spacing="2" fill="#a1a1a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03</text>
      <text x="1164" y="365" font-size="22" font-weight="700" fill="#fafafa">Verify writes no file</text>
      <text x="1164" y="395" font-size="18" fill="#a1a1a1">A CRITICAL finding becomes</text>
      <text x="1164" y="421" font-size="18" fill="#a1a1a1">a new unticked task.</text>
    </g>

    <!-- row 2: two wider property cards -->
    <g>
      <rect x="72" y="468" width="718" height="190" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="96" y="492" width="64" height="64" rx="12" fill="#2b7fff" fill-opacity="0.14"/>
      <use href="#i-shield" x="112" y="508" width="32" height="32" color="#2b7fff"/>
      <text x="180" y="503" font-size="15" font-weight="600" letter-spacing="2" fill="#a1a1a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">04</text>
      <text x="180" y="533" font-size="22" font-weight="700" fill="#fafafa">Archive before DONE</text>
      <text x="180" y="565" font-size="18" fill="#a1a1a1">Two guards refuse the shortcut:</text>
      <use href="#i-ban" x="180" y="582" width="18" height="18" color="#ff6467"/>
      <text x="208" y="597" font-size="18" fill="#a1a1a1"><tspan font-weight="700" fill="#fafafa">archive</tspan> while <tspan font-size="17" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tasks.md</tspan> has an unfinished task</text>
      <use href="#i-ban" x="180" y="614" width="18" height="18" color="#ff6467"/>
      <text x="208" y="629" font-size="18" fill="#a1a1a1"><tspan font-weight="700" fill="#fafafa">DONE</tspan> while the change is still active</text>

      <rect x="810" y="468" width="718" height="190" rx="14" fill="#171717" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="834" y="492" width="64" height="64" rx="12" fill="#ff6467" fill-opacity="0.12"/>
      <use href="#i-stop" x="850" y="508" width="32" height="32" color="#ff6467"/>
      <text x="918" y="503" font-size="15" font-weight="600" letter-spacing="2" fill="#a1a1a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">05</text>
      <text x="918" y="533" font-size="22" font-weight="700" fill="#fafafa">A stop names its reason</text>
      <text x="918" y="565" font-size="18" fill="#a1a1a1">When a human decision is needed,</text>
      <rect x="918" y="578" width="112" height="28" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="974" y="597" font-size="16" text-anchor="middle" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">escalate</text>
      <text x="1048" y="597" font-size="18" text-anchor="middle" fill="#a1a1a1">or</text>
      <rect x="1066" y="578" width="256" height="28" rx="10" fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="1194" y="597" font-size="16" text-anchor="middle" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#2b7fff">delivery</tspan> block --reason</text>
      <text x="918" y="629" font-size="18" fill="#a1a1a1">records <tspan font-weight="700" fill="#ff6467">BLOCKED</tspan> and the reason.</text>
    </g>

    <!-- note -->
    <g>
      <rect x="72" y="678" width="1456" height="60" rx="14" fill="#171717" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.10"/>
      <use href="#i-info" x="90" y="697" width="22" height="22" color="#a1a1a1"/>
      <text x="122" y="714" font-size="18" fill="#a1a1a1"><tspan fill="#fafafa">Verify is advisory:</tspan> the session that wrote the code also checks it. Review the diff before you rely on a delivered story.</text>
    </g>

    <!-- footer -->
    <rect x="72" y="822" width="1456" height="1" fill="#ffffff" fill-opacity="0.10"/>
    <text x="72" y="864" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#fafafa">Oh<tspan fill="url(#hl)">My</tspan>Orch</text>
    <text x="800" y="862" font-size="15" letter-spacing="3" text-anchor="middle" fill="#737373">CLAUDE CODE + OPENSPEC</text>
    <g transform="translate(1408 844) scale(0.6)" fill-rule="evenodd">
      <g fill="#c92b60">
        <path d="M26.8 5.8C26.8 5.3 26.4 5.1 25.9 5.3C22.3 6.5 20.8 9.1 20.8 12.8V21.2C20.8 26.3 17.8 29.1 12.8 29.1H9.1C6.2 29.1 4.3 31.0 4.1 33.7C4.1 34.0 4.3 34.2 4.7 34.2H12.9C21.6 34.2 26.8 29.2 26.8 21.1Z"/>
        <path d="M40.4 12.5C33.9 12.5 29.3 17.2 29.3 23.5C29.3 29.8 33.9 34.5 40.4 34.5C46.9 34.5 51.5 29.8 51.5 23.5C51.5 17.2 46.9 12.5 40.4 12.5ZM40.4 18.0C43.6 18.0 45.9 20.3 45.9 23.5C45.9 26.7 43.6 29.0 40.4 29.0C37.2 29.0 34.9 26.7 34.9 23.5C34.9 20.3 37.2 18.0 40.4 18.0Z"/>
        <path d="M68.0 14.4C65.8 13.1 63.6 12.5 61.0 12.5C55.9 12.5 52.4 15.2 52.4 19.3C52.4 23.2 55.3 24.7 59.4 25.7L61.4 26.2C63.1 26.6 63.8 27.1 63.8 27.9C63.8 28.9 62.8 29.5 61.1 29.5C58.5 29.5 56.0 28.5 53.8 26.9C53.5 26.7 53.2 26.8 53.0 27.1L51.1 30.4C50.9 30.7 51.0 31.0 51.3 31.2C54.0 33.4 57.5 34.5 61.0 34.5C66.3 34.5 69.7 31.8 69.7 27.5C69.7 23.7 67.0 22.1 62.8 21.1L60.6 20.6C58.9 20.2 58.2 19.7 58.2 18.9C58.2 18.0 59.2 17.5 60.8 17.5C62.7 17.5 64.4 18.0 66.2 19.0C66.5 19.2 66.8 19.1 67.0 18.8L68.2 15.1C68.4 14.8 68.3 14.6 68.0 14.4Z"/>
        <path d="M81.8 12.5C75.3 12.5 70.7 17.2 70.7 23.5C70.7 29.8 75.3 34.5 81.8 34.5C88.3 34.5 92.9 29.8 92.9 23.5C92.9 17.2 88.3 12.5 81.8 12.5ZM81.8 18.0C85.0 18.0 87.3 20.3 87.3 23.5C87.3 26.7 85.0 29.0 81.8 29.0C78.6 29.0 76.3 26.7 76.3 23.5C76.3 20.3 78.6 18.0 81.8 18.0Z"/>
        <path d="M100.2 33.4V23.5C100.2 20.3 102.1 18.4 105.4 18.4H107.4C107.7 18.4 107.9 18.2 107.9 17.9V13.4C107.9 13.1 107.7 12.9 107.4 12.9H105.1C98.5 12.9 94.5 16.9 94.5 23.4V33.4C94.5 33.8 94.7 34.0 95.1 34.0H99.6C100.0 34.0 100.2 33.8 100.2 33.4Z"/>
        <path d="M119.4 12.5C112.9 12.5 108.3 17.2 108.3 23.5C108.3 29.8 112.9 34.5 119.4 34.5C125.9 34.5 130.5 29.8 130.5 23.5C130.5 17.2 125.9 12.5 119.4 12.5ZM119.4 18.0C122.6 18.0 124.9 20.3 124.9 23.5C124.9 26.7 122.6 29.0 119.4 29.0C116.2 29.0 113.9 26.7 113.9 23.5C113.9 20.3 116.2 18.0 119.4 18.0Z"/>
        <path d="M133.0 33.4V22.9C133.0 16.7 137.0 12.5 142.8 12.5C146.1 12.5 148.6 13.8 150.4 15.9C152.2 13.8 154.7 12.5 158.0 12.5C163.8 12.5 167.8 16.7 167.8 22.9V33.4C167.8 33.8 167.6 34.0 167.2 34.0H162.7C162.3 34.0 162.1 33.8 162.1 33.4V23.0C162.1 19.8 160.6 18.0 158.0 18.0C155.4 18.0 153.3 19.8 153.3 23.0V33.4C153.3 33.8 153.1 34.0 152.7 34.0H148.2C147.8 34.0 147.6 33.8 147.6 33.4V23.0C147.6 19.8 145.4 18.0 142.8 18.0C140.2 18.0 138.7 19.8 138.7 23.0V33.4C138.7 33.8 138.5 34.0 138.1 34.0H133.6C133.2 34.0 133.0 33.8 133.0 33.4Z"/>
      </g>
      <path fill="#087fa9" d="M183.6 11.7C176.8 11.7 171.9 16.5 171.9 23.1C171.9 29.6 176.8 34.0 183.6 34.0H194.6C195.0 34.0 195.2 33.8 195.2 33.4V23.1C195.2 16.5 190.3 11.7 183.6 11.7ZM183.6 17.3C187.1 17.3 189.5 19.7 189.5 23.1V28.5H183.6C180.1 28.5 177.6 26.3 177.6 23.1C177.6 19.7 180.1 17.3 183.6 17.3Z"/>
    </g>
  </g>
</svg>
